---
- hosts: devvm
  become: true

  tasks:
  - name: Set timezone
    community.general.timezone:
      name: Australia/Melbourne
    notify: Restart cron
    tags: timezone

  - name: Ensure the universe component is enabled
    ansible.builtin.apt_repository:
      repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} universe"
      state: present

  - name: Install packages not present on a stock Ubuntu cloud image
    ansible.builtin.apt:
      name:
        - pigz
        - zfsutils-linux
        - nodejs
        - npm
      state: present
      update_cache: true
      install_recommends: false
  
  - name: Ensure prerequisites for repo management are present
    ansible.builtin.apt:
      name:
        - software-properties-common  # provides add-apt-repository / apt_repository support
        - python3-debian               # required by deb822_repository
      state: present

  # --- mise -------------------------------------------------------------

  - name: Install extrepo
    ansible.builtin.apt:
      name: extrepo
      state: present
  
  - name: Enable the mise apt repository via extrepo
    ansible.builtin.command: extrepo enable mise
    args:
      creates: /etc/apt/sources.list.d/extrepo_mise.sources

  - name: Install mise
    ansible.builtin.apt:
      name: mise
      state: present
      update_cache: true

  # --- GitHub CLI ---------------------------------------------------------

  - name: Add GitHub CLI apt repository
    ansible.builtin.deb822_repository:
      name: github-cli
      types: deb
      uris: https://cli.github.com/packages
      suites: stable
      components: main
      signed_by: https://cli.github.com/packages/githubcli-archive-keyring.gpg

  - name: Install GitHub CLI
    ansible.builtin.apt:
      name: gh
      state: present
      update_cache: true
      install_recommends: false

  # --- Docker -------------------------------------------------------------

  - name: Add Docker apt repository
    ansible.builtin.deb822_repository:
      name: docker
      types: deb
      uris: https://download.docker.com/linux/ubuntu
      suites: "{{ ansible_distribution_release }}"
      components: stable
      signed_by: https://download.docker.com/linux/ubuntu/gpg

  - name: Install Docker packages
    ansible.builtin.apt:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
      state: present
      update_cache: true
      install_recommends: false

  # --- VS Code CLI ---------------------------------------------------------  
  - name: Download VS Code CLI archive
    ansible.builtin.get_url:
      url: "https://code.visualstudio.com/sha/download?build=stable&os=cli-alpine-x64"
      dest: /tmp/vscode_cli.tar.gz
      mode: '0644'
  
  - name: Extract VS Code CLI
    ansible.builtin.unarchive:
      src: /tmp/vscode_cli.tar.gz
      dest: /usr/local/bin
      remote_src: true
      creates: /usr/local/bin/code
  
  # `code tunnel service install` needs an interactive GitHub device-code
  # login, so it can't be run unattended from here — these two tasks just
  # get the prerequisite in place and tell you the command to run if the
  # service isn't set up yet.
  - name: Enable linger for the dev user so user-level services persist after logout
    ansible.builtin.command: "loginctl enable-linger {{ dev_user | default('devops') }}"
    args:
      creates: "/var/lib/systemd/linger/{{ dev_user | default('devops') }}"
  
  - name: Check whether the VS Code tunnel service is installed
    ansible.builtin.stat:
      path: "/home/{{ dev_user | default('devops') }}/.config/systemd/user/code-tunnel.service"
    register: vscode_tunnel_service
  
  - name: Show setup command if the VS Code tunnel service isn't installed yet
    ansible.builtin.debug:
      msg: >-
        VS Code tunnel service not found. SSH in as
        {{ dev_user | default('devops') }} and run: code tunnel service install
    when: not vscode_tunnel_service.stat.exists
    changed_when: true
  
  # --- Claude Code ----------------------------------------------------------  
  - name: Add Claude Code apt repository
    ansible.builtin.deb822_repository:
      name: claude-code
      types: deb
      uris: https://downloads.claude.ai/claude-code/apt/stable
      suites: stable
      components: main
      signed_by: https://downloads.claude.ai/keys/claude-code.asc
  
  - name: Install Claude Code
    ansible.builtin.apt:
      name: claude-code
      state: present
      update_cache: true
  
  # --- Projects directory & repo clone ---------------------------------------
  
  - name: Ensure projects directory exists
    ansible.builtin.file:
      path: "/home/{{ dev_user | default('devops') }}/projects"
      state: directory
      owner: "{{ dev_user | default('devops') }}"
      group: "{{ dev_user | default('devops') }}"
      mode: '0755'
  
  - name: Fetch list of public repositories for the GitHub account
    ansible.builtin.uri:
      url: "https://api.github.com/users/{{ github_user | default('acbgbca') }}/repos?per_page=100"
      return_content: true
    register: github_repos
  
  - name: Clone all repositories into the projects directory
    ansible.builtin.git:
      repo: "{{ item.clone_url }}"
      dest: "/home/{{ dev_user | default('devops') }}/projects/{{ item.name }}"
      update: false
    loop: "{{ github_repos.json }}"
    loop_control:
      label: "{{ item.name }}"
    become: true
    become_user: "{{ dev_user | default('devops') }}"

  # --- Automatic updates -------------------------------------------------
  - name: Install unattended-upgrades
    ansible.builtin.apt:
      name: unattended-upgrades
      state: present
  
  - name: Enable periodic apt actions
    ansible.builtin.copy:
      dest: /etc/apt/apt.conf.d/20auto-upgrades
      content: |
        APT::Periodic::Update-Package-Lists "1";
        APT::Periodic::Download-Upgradeable-Packages "1";
        APT::Periodic::AutocleanInterval "7";
        APT::Periodic::Unattended-Upgrade "1";
      mode: '0644'
  
  - name: Configure unattended-upgrades
    ansible.builtin.copy:
      dest: /etc/apt/apt.conf.d/50unattended-upgrades
      content: |
        Unattended-Upgrade::Allowed-Origins {
            "${distro_id}:${distro_codename}-security";
            "${distro_id}:${distro_codename}-updates";
        };
        Unattended-Upgrade::Remove-Unused-Dependencies "true";
        Unattended-Upgrade::Automatic-Reboot "true";
        Unattended-Upgrade::Automatic-Reboot-Time "03:00";
      mode: '0644'
  
  - name: Ensure the apt-daily-upgrade timer override directory exists
    ansible.builtin.file:
      path: /etc/systemd/system/apt-daily-upgrade.timer.d
      state: directory
      mode: '0755'
  
  - name: Set the upgrade timer to run weekly, Sunday 22:00
    ansible.builtin.copy:
      dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
      content: |
        [Timer]
        OnCalendar=
        OnCalendar=Sun *-*-* 22:00:00
        RandomizedDelaySec=0
        Persistent=true
      mode: '0644'
  
  - name: Ensure the apt-daily-upgrade timer is enabled and running
    ansible.builtin.systemd:
      name: apt-daily-upgrade.timer
      daemon_reload: true
      enabled: true
      state: started

  handlers:
  - name: Restart cron
    service:
      name: cron
      state: restarted