---
libvirt_vms: []

libvirt_vm_image_dir: /var/lib/libvirt/images
libvirt_vm_disk_host_dir: /mnt/ssd256/vm_disks
libvirt_vm_release: noble
libvirt_vm_os_variant: ubuntu24.04
libvirt_vm_disk_filesystem: ext4

# Guest NIC name. Single virtio NIC on an Ubuntu cloud image is enp1s0.
libvirt_vm_interface: enp1s0

# How guests attach to the network:
#   macvtap  VM gets a LAN address via the host's physical NIC. Host
#            and VM cannot talk to each other (inherent to macvtap).
#   bridge   VM on a host bridge. Full connectivity, but the host's
#            IP must move onto the bridge.
#   network  A libvirt network (NAT). Outbound only.
libvirt_vm_network_mode: macvtap
libvirt_vm_host_nic: ""             # "" = autodetect from default route
libvirt_vm_libvirt_network: default
libvirt_vm_bridge: br0
libvirt_vm_cidr: 24
 
# Host bridge management — only relevant for network_mode: bridge.
libvirt_host_bridge_manage: false
libvirt_host_bridge: "{{ libvirt_vm_bridge }}"
libvirt_host_bridge_parent: ""      # "" = autodetect from default route
libvirt_host_bridge_address: ""     # "" = keep the host's current address
libvirt_host_bridge_gateway: ""     # "" = keep the host's current gateway
libvirt_host_bridge_nameservers:
  - 192.168.94.1
libvirt_vm_gateway: ""
libvirt_vm_nameservers:
  - 192.168.94.1

libvirt_vm_user: devops
libvirt_vm_ssh_key_files:
  - authorized_sshkey.pub

libvirt_vm_memory_mb: 2048
libvirt_vm_vcpus: 2
libvirt_vm_disk_gb: 20

# Installed into every guest by cloud-init. Keep minimal — Ansible does
# the rest once the guest is up.
libvirt_vm_packages:
  - qemu-guest-agent

libvirt_vm_host_packages:
  - qemu-kvm
  - libvirt-daemon-system
  - virtinst
  - cloud-image-utils
  - qemu-utils
  - python3-libvirt
  - python3-lxml
  - cockpit-machines